<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <!-- Bootstrap CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
            <!-- Displays the course name -->
            <h1 class="display-5 fw-bold text-primary">{{ course.name }}</h1>
            <hr class="my-4">
            
            <h3 class="mb-3 text-secondary">Lessons</h3>
            <div class="list-group">
                <!-- Django loop to show related lessons -->
                {% for lesson in course.lessons.all %}
                    <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                        <div class="fw-bold">{{ lesson.title }}</div>
                        <span class="badge bg-secondary rounded-pill">{{ lesson.duration }} mins</span>
                    </div>
                {% empty %}
                    <div class="list-group-item text-muted">No lessons available.</div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
